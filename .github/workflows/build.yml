name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install uv
          uv sync
          uv add --dev pyinstaller

      # Windows: one single .exe (unchanged)
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller --onefile --windowed --name StoryboardAnimatic-Windows.exe --paths src --collect-data imageio_ffmpeg --hidden-import imageio_ffmpeg --collect-all PySide6 main.py

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: ./dist/StoryboardAnimatic-Windows.exe --smoke-test
        shell: bash
        timeout-minutes: 1

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: StoryboardAnimatic-Windows.exe
          path: dist/StoryboardAnimatic-Windows.exe

      # macOS: a real double-clickable .app, zipped into one download
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run pyinstaller --windowed --name StoryboardAnimatic-Mac --paths src --collect-data imageio_ffmpeg --hidden-import imageio_ffmpeg --collect-all PySide6 main.py
          ditto -c -k --keepParent "dist/StoryboardAnimatic-Mac.app" "dist/StoryboardAnimatic-Mac.zip"

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./dist/StoryboardAnimatic-Mac.app/Contents/MacOS/StoryboardAnimatic-Mac --smoke-test
        shell: bash
        timeout-minutes: 1

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: StoryboardAnimatic-Mac.zip
          path: dist/StoryboardAnimatic-Mac.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
